<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday Sara ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#f8dce7;
}

.app{
width:100%;
max-width:430px;
height:100dvh;
margin:auto;
background:linear-gradient(#fdeaf1,#ffdce8);
position:relative;
overflow:hidden;
}

.page{
display:none;
width:100%;
height:100%;
padding:16px;
flex-direction:column;
}

.active{
display:flex;
}

.top{
display:flex;
justify-content:space-between;
}

.pill{
background:#fff;
padding:10px 18px;
border-radius:999px;
font-weight:bold;
color:#ff2d7f;
}

.title{
font-size:34px;
font-weight:800;
text-align:center;
margin-top:25px;
color:#c10059;
}

.musicBtn{
position:absolute;
top:14px;
right:14px;
border:none;
padding:10px;
border-radius:50%;
z-index:99;
}

.balloonArea{
flex:1;
position:relative;
}

.balloon{
position:absolute;
width:80px;
height:100px;
border-radius:50%;
transition:.4s;
cursor:pointer;
}

.balloon::after{
content:"";
position:absolute;
height:35px;
width:2px;
background:#999;
left:39px;
bottom:-30px;
}

.b1{left:8%;top:20%;background:#ffc4d8;}
.b2{right:8%;top:24%;background:#c2f0ef;}
.b3{left:14%;bottom:22%;background:#dcc6ff;}
.b4{right:14%;bottom:20%;background:#ffd0da;}

.pop{
opacity:0;
transform:scale(1.7);
pointer-events:none;
}

/* Message at balloon position */

.blastMessage{
position:absolute;
background:white;
padding:10px 14px;
border-radius:16px;
font-size:14px;
font-weight:bold;
color:#ff0a7a;
max-width:140px;
text-align:center;
box-shadow:0 4px 12px rgba(0,0,0,.15);
animation:showMsg 2s forwards;
z-index:20;
}

@keyframes showMsg{

0%{
opacity:0;
transform:scale(.5);
}

20%{
opacity:1;
transform:scale(1);
}

100%{
opacity:0;
transform:translateY(-40px);
}

}

/* cake */

.card{
flex:1;
margin-top:20px;
background:#f7dce7;
border-radius:28px;
padding:20px;
text-align:center;
}

.cake{
font-size:130px;
margin-top:50px;
cursor:pointer;
}

.tap{
margin-top:25px;
padding:16px;
background:white;
border-radius:18px;
}

/* collage */

.collage{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
}

.bouquet{
width:140px;
max-width:40vw;
}

.photoGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
max-width:320px;
}

.photo{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:20px;
border:4px solid white;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.notes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
}

.note{
background:white;
padding:8px 12px;
border-radius:16px;
font-size:13px;
}

.btn{
margin:15px auto;
padding:14px 45px;
border:none;
border-radius:999px;
background:#ff0a7a;
color:white;
font-size:18px;
}

.final{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
text-align:center;
}

.heart{
position:absolute;
pointer-events:none;
animation:rise 5s linear forwards;
}

@keyframes rise{

from{
transform:translateY(100%);
opacity:1;
}

to{
transform:translateY(-120vh);
opacity:0;
}

}

</style>
</head>

<body>

<audio id="music" loop>
<source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<div class="app">

<button class="musicBtn" id="musicBtn">🎵</button>

<!-- PAGE 1 -->

<div class="page active" id="p1">

<div class="top">

<div class="pill">Sara ❤️</div>

<div class="pill">1/4</div>

</div>

<div class="title">
Pop all balloons 🎈
</div>

<div class="balloonArea">

<div class="balloon b1" onclick="popBalloon(this)"></div>
<div class="balloon b2" onclick="popBalloon(this)"></div>
<div class="balloon b3" onclick="popBalloon(this)"></div>
<div class="balloon b4" onclick="popBalloon(this)"></div>

</div>

</div>

<!-- PAGE 2 -->

<div class="page" id="p2">

<div class="card">

<h2>Blow Candle Sara ✨</h2>

<div class="cake" onclick="showPage('p3')">
🎂
</div>

<div class="tap">
Tap cake to continue ❤️
</div>

</div>

</div>

<!-- PAGE 3 -->

<div class="page" id="p3">

<h2 style="text-align:center;color:#ff0a7a">
Memories With Sara ❤️
</h2>

<div class="collage">

<img src="bouquet.png" class="bouquet">

<div class="photoGrid">

<img src="photo1.jpg" class="photo">
<img src="photo2.jpg" class="photo">
<img src="photo3.jpg" class="photo">
<img src="photo4.jpg" class="photo">

</div>

<div class="notes">

<div class="note">Forever Yours 🤍</div>
<div class="note">Beautiful Soul 💕</div>
<div class="note">My Sunshine ☀️</div>
<div class="note">Happy Birthday 💖</div>

</div>

</div>

<button class="btn" onclick="showPage('p4')">
Continue →
</button>

</div>

<!-- PAGE 4 -->

<div class="page" id="p4">

<div class="final">

<div style="font-size:100px">
🎁
</div>

<h1>
Happy Birthday Sara ❤️
</h1>

<p>
May your smile stay forever ✨
</p>

<button class="btn" onclick="location.reload()">
Replay
</button>

</div>

</div>

</div>

<script>

const messages=[
"You’re my happiness ❤️",
"You make life beautiful ✨",
"Thank you for being mine 💕",
"Happy Birthday My Love 🎂"
];

let popped=0;

function popBalloon(balloon){

if(balloon.classList.contains("pop")) return;

const rect=balloon.getBoundingClientRect();

const parent=document.querySelector(".balloonArea")
.getBoundingClientRect();

balloon.classList.add("pop");

const msg=document.createElement("div");

msg.className="blastMessage";

msg.innerText=messages[popped];

msg.style.left=(rect.left-parent.left)+"px";

msg.style.top=(rect.top-parent.top)+"px";

document.querySelector(".balloonArea")
.appendChild(msg);

setTimeout(()=>{
msg.remove();
},2000);

popped++;

if(popped===4){

setTimeout(()=>{
showPage("p2");
},2200);

}

}

function showPage(id){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}

const music=document.getElementById("music");

document.body.addEventListener("click",()=>{

music.play().catch(()=>{});

},{once:true});

document.getElementById("musicBtn").onclick=()=>{

if(music.paused){
music.play();
}else{
music.pause();
}

};

setInterval(()=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML="💗";

h.style.left=Math.random()*100+"%";

document.querySelector(".app")
.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

},1200);

</script>

</body>
</html>
