```html id="piv3m1"
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Happy Birthday Sara ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f7dce7;
overflow:hidden;
height:100vh;
}

.app{
width:100vw;
max-width:430px;
height:100vh;
margin:auto;
position:relative;
overflow:hidden;
background:linear-gradient(#fdeaf1,#ffdbe8);
}

.page{
display:none;
position:absolute;
width:100%;
height:100%;
padding:18px;
}

.active{
display:block;
animation:fade .4s ease;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.top{
display:flex;
justify-content:space-between;
}

.pill{
background:white;
padding:10px 18px;
border-radius:999px;
font-weight:bold;
color:#ff2d7f;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.title{
text-align:center;
font-size:34px;
font-weight:800;
margin-top:40px;
color:#c00059;
}

/* balloons */

.balloon{
position:absolute;
width:90px;
height:115px;
border-radius:50%;
cursor:pointer;
transition:.4s;
}

.balloon:after{
content:"";
position:absolute;
height:40px;
width:2px;
background:#999;
left:44px;
bottom:-35px;
}

.b1{left:10%;top:28%;background:#ffc3d8;}
.b2{right:10%;top:32%;background:#bdeeee;}
.b3{left:15%;bottom:24%;background:#dbc6ff;}
.b4{right:15%;bottom:22%;background:#ffced8;}

.pop{
opacity:0;
transform:scale(1.7);
}

/* cake */

.card{
margin-top:20px;
height:78vh;
background:#f8dce7;
border-radius:28px;
padding:20px;
text-align:center;
}

.cakeTitle{
font-size:32px;
font-weight:bold;
color:#9b004c;
}

.cake{
font-size:150px;
margin-top:90px;
cursor:pointer;
}

.tap{
background:white;
padding:16px;
border-radius:20px;
margin-top:50px;
font-size:20px;
}

/* bouquet collage */

.collageTitle{
text-align:center;
font-size:30px;
color:#ff0b7a;
margin-top:10px;
}

.bouquet{
width:280px;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.note{
position:absolute;
background:white;
padding:10px 12px;
border-radius:18px;
font-size:14px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
max-width:140px;
}

.n1{left:8px;top:130px;}
.n2{right:8px;top:170px;}
.n3{left:8px;bottom:240px;}
.n4{right:8px;bottom:220px;}
.n5{
left:50%;
bottom:120px;
transform:translateX(-50%);
}

/* buttons */

.btn{
position:absolute;
left:50%;
bottom:35px;
transform:translateX(-50%);
border:none;
padding:16px 55px;
border-radius:999px;
font-size:20px;
background:#ff0a7a;
color:white;
}

.musicBtn{
position:absolute;
top:15px;
right:15px;
z-index:1000;
border:none;
padding:10px 14px;
border-radius:999px;
}

/* final */

.final{
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

/* hearts */

.heart{
position:absolute;
font-size:20px;
animation:rise 6s linear forwards;
pointer-events:none;
}

@keyframes rise{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-120px);
opacity:0;
}
}

</style>
</head>

<body>

<audio id="bgmusic" loop>
<source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<div class="app">

<button class="musicBtn" id="musicBtn">🎵</button>

<!-- PAGE 1 -->

<div class="page active" id="p1">

<div class="top">

<div class="pill">Sara ❤️</div>

<div class="pill">1/4</div>

</div>

<div class="title">Pop all balloons</div>

<div class="balloon b1" onclick="popBalloon(this)"></div>
<div class="balloon b2" onclick="popBalloon(this)"></div>
<div class="balloon b3" onclick="popBalloon(this)"></div>
<div class="balloon b4" onclick="popBalloon(this)"></div>

</div>

<!-- PAGE 2 -->

<div class="page" id="p2">

<div class="card">

<div class="cakeTitle">
Blow Candle Sara ✨
</div>

<div class="cake" onclick="showPage('p3')">
🎂
</div>

<div class="tap">
Tap cake to continue ❤️
</div>

</div>

</div>

<!-- PAGE 3 -->

<div class="page" id="p3">

<h2 class="collageTitle">
Your Rose Bouquet 🌹
</h2>

<div class="note n1">Forever Yours 🤍</div>
<div class="note n2">Beautiful Soul 💕</div>
<div class="note n3">My Sunshine ☀️</div>
<div class="note n4">Happy Birthday 💖</div>
<div class="note n5">Sara ❤️</div>

<img src="bouquet.png" class="bouquet" alt="Bouquet">

<button class="btn"
onclick="showPage('p4')">
Continue →
</button>

</div>

<!-- PAGE 4 -->

<div class="page" id="p4">

<div class="final">

<div style="font-size:110px">
🎁
</div>

<h1 style="font-size:42px;color:#c00059">
Happy Birthday Sara ❤️
</h1>

<p style="font-size:22px;margin-top:20px">
May your smile stay forever ✨
</p>

<button class="btn"
onclick="location.reload()">
Replay
</button>

</div>

</div>

</div>

<script>

const music=document.getElementById("bgmusic");
const musicBtn=document.getElementById("musicBtn");

document.addEventListener("click",()=>{

music.play().catch(()=>{});

},{once:true});

musicBtn.addEventListener("click",()=>{

if(music.paused){

music.play();

musicBtn.innerHTML="🎵";

}else{

music.pause();

musicBtn.innerHTML="▶️";

}

});

let popped=0;

function popBalloon(balloon){

balloon.classList.add("pop");

popped++;

if(popped===4){

setTimeout(()=>{

showPage("p2");

},500);

}

}

function showPage(id){

document.querySelectorAll(".page")

.forEach(page=>page.classList.remove("active"));

document.getElementById(id)

.classList.add("active");

}

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💗";

heart.style.left=Math.random()*100+"%";

document.querySelector(".app")

.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},700);

</script>

</body>
</html>
```
