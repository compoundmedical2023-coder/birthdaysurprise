```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara Birthday</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:#f7dce7;
overflow:hidden;
height:100vh;
}

.page{
display:none;
width:100vw;
height:100vh;
position:absolute;
background:linear-gradient(#fdeaf2,#ffd9e7);
padding:18px;
}

.active{
display:block;
}

.top{
display:flex;
justify-content:space-between;
}

.box{
background:#fff;
padding:12px 20px;
border-radius:999px;
font-weight:bold;
color:#ff3a88;
}

.title{
font-size:36px;
font-weight:800;
text-align:center;
color:#c00058;
margin-top:35px;
}

.balloon{
position:absolute;
width:90px;
height:115px;
border-radius:50%;
}

.b1{left:25px;top:190px;background:#ffc6dc;}
.b2{right:25px;top:210px;background:#bdf3ef;}
.b3{left:55px;bottom:180px;background:#dec9ff;}
.b4{right:55px;bottom:170px;background:#ffc9d7;}

.balloon:after{
content:"";
position:absolute;
width:2px;
height:40px;
background:#999;
left:45px;
bottom:-35px;
}

.card{

margin-top:30px;

height:78vh;

background:#f8dce7;

border-radius:30px;

padding:20px;

}

.cakeTitle{

text-align:center;

font-size:34px;

font-weight:bold;

color:#9f004b;

}

.cake{

font-size:170px;

text-align:center;

margin-top:90px;

}

.tap{

background:white;

padding:18px;

border-radius:22px;

margin-top:60px;

text-align:center;

font-size:22px;

}

.bouquetPage{

background:linear-gradient(#f9e7d8,#ffd6e7);

}

.bouquetTitle{

text-align:center;

font-size:30px;

padding-top:20px;

color:#ff0b7b;

}

.bouquet{

position:absolute;

top:52%;

left:50%;

transform:translate(-50%,-50%);

width:290px;

}

.note{

position:absolute;

background:white;

padding:12px;

border-radius:18px;

font-size:15px;

box-shadow:0 3px 10px rgba(0,0,0,.1);

}

.n1{top:140px;left:10px}
.n2{top:180px;right:10px}
.n3{bottom:240px;left:15px}
.n4{bottom:210px;right:15px}
.n5{bottom:120px;left:50%;transform:translateX(-50%)}

.btn{

position:absolute;

bottom:35px;

left:50%;

transform:translateX(-50%);

padding:18px 60px;

border:none;

border-radius:40px;

background:#ff0a7a;

color:white;

font-size:22px;

}

.final{

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

height:100%;

text-align:center;

padding:20px;

}

</style>
</head>

<body>

<div class="page active" id="p1">

<div class="top">

<div class="box">← Back</div>

<div class="box">2/4</div>

</div>

<div class="title">

Pop all 4 balloons

</div>

<div class="balloon b1" onclick="pop(this)"></div>
<div class="balloon b2" onclick="pop(this)"></div>
<div class="balloon b3" onclick="pop(this)"></div>
<div class="balloon b4" onclick="pop(this)"></div>

</div>


<div class="page" id="p2">

<div class="card">

<div class="cakeTitle">

Blow the candle, Sara

</div>

<div class="cake"

onclick="show('p3')">

🎂

</div>

<div class="tap">

Tap cake to continue ✨

</div>

</div>

</div>


<div class="page bouquetPage" id="p3">

<div class="bouquetTitle">

Your Rose Bouquet 🌹

</div>

<div class="note n1">Forever yours 🤍</div>
<div class="note n2">Beautiful Soul 💕</div>
<div class="note n3">My Sunshine ☀️</div>
<div class="note n4">Happy Birthday 💖</div>
<div class="note n5">Sara ❤️</div>

<img src="bouquet.png" class="bouquet">

<button class="btn"

onclick="show('p4')">

Continue →

</button>

</div>


<div class="page" id="p4">

<div class="final">

<div style="font-size:120px">

🎁

</div>

<h1 style="font-size:46px;color:#c00058">

Happy Birthday Sara ❤️

</h1>

<p style="font-size:22px;margin-top:20px">

May your smile stay forever ✨

</p>

<button class="btn"

onclick="location.reload()">

Replay

</button>

</div>

</div>

<script>

let count=0;

function pop(x){

x.style.opacity=0;

count++;

if(count==4){

setTimeout(()=>show("p2"),500);

}

}

function show(id){

document.querySelectorAll(".page")

.forEach(a=>a.classList.remove("active"));

document.getElementById(id)

.classList.add("active");

}

</script>

</body>
</html>
```
