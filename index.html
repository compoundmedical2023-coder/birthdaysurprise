<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Happy Birthday Sara ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
-webkit-tap-highlight-color:transparent;
}

body{
background:#f8dfe8;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:100vw;
max-width:430px;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(#fdebf2,#ffd9e7);
}

.page{
display:none;
position:absolute;
width:100%;
height:100%;
padding:18px;
}

.active{
display:block;
animation:fade .5s;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.top{
display:flex;
justify-content:space-between;
}

.pill{
background:white;
padding:12px 20px;
border-radius:999px;
font-weight:bold;
color:#ff2a7b;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.title{
margin-top:45px;
text-align:center;
font-size:36px;
font-weight:800;
color:#c10059;
}

.balloon{
position:absolute;
width:90px;
height:115px;
border-radius:50%;
cursor:pointer;
animation:float 3s infinite ease-in-out;
}

.balloon:after{
content:"";
position:absolute;
height:40px;
width:2px;
background:#999;
left:45px;
bottom:-35px;
}

.b1{left:8%;top:28%;background:#ffc4d9;}
.b2{right:8%;top:32%;background:#c0f1ef;}
.b3{left:14%;bottom:26%;background:#dcc5ff;}
.b4{right:14%;bottom:24%;background:#ffc9d7;}

@keyframes float{
50%{transform:translateY(-12px);}
}

.pop{
opacity:0;
transform:scale(1.8);
transition:.4s;
}

.card{
margin-top:20px;
height:78vh;
background:#f8dce7;
border-radius:30px;
padding:20px;
text-align:center;
}

.cakeTitle{
font-size:34px;
font-weight:bold;
color:#98004b;
}

.cake{
font-size:170px;
margin-top:80px;
cursor:pointer;
}

.tap{
background:white;
padding:18px;
border-radius:22px;
margin-top:55px;
font-size:22px;
}

.collageTitle{
text-align:center;
font-size:30px;
color:#ff0a7a;
margin-top:10px;
}

.bouquet{
width:300px;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
filter:drop-shadow(0 10px 20px rgba(0,0,0,.2));
}

.note{
position:absolute;
background:white;
padding:12px;
border-radius:18px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
font-size:15px;
max-width:150px;
}

.n1{left:10px;top:120px}
.n2{right:10px;top:160px}
.n3{left:10px;bottom:240px}
.n4{right:10px;bottom:220px}
.n5{left:50%;bottom:120px;transform:translateX(-50%)}

.btn{
position:absolute;
bottom:35px;
left:50%;
transform:translateX(-50%);
border:none;
padding:18px 60px;
border-radius:40px;
font-size:22px;
background:#ff0a7a;
color:white;
}

.final{
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.heart{
position:absolute;
font-size:22px;
animation:rise 6s linear infinite;
}

@keyframes rise{
from{transform:translateY(100vh)}
to{
transform:translateY(-100px);
opacity:0;
}
}

.musicBtn{
position:absolute;
top:20px;
right:20px;
z-index:999;
border:none;
padding:10px 15px;
border-radius:30px;
}

</style>
</head>

<body>

<audio id="bgmusic" loop>
<source src="birthday-song.mp3" type="audio/mpeg">
</audio>

<div class="app">

<button class="musicBtn" id="musicBtn">
🎵
</button>

<!-- PAGE 1 -->

<div class="page active" id="p1">

<div class="top">

<div class="pill">Sara ❤️</div>

<div class="pill">1/4</div>

</div>

<div class="title">

Pop all balloons

</div>

<div class="balloon b1" onclick="pop(this)"></div>
<div class="balloon b2" onclick="pop(this)"></div>
<div class="balloon b3" onclick="pop(this)"></div>
<div class="balloon b4" onclick="pop(this)"></div>

</div>


<!-- PAGE 2 -->

<div class="page" id="p2">

<div class="card">

<div class="cakeTitle">

Blow Candle Sara ✨

</div>

<div class="cake"

onclick="show('p3')">

🎂

</div>

<div class="tap">

Tap cake ❤️

</div>

</div>

</div>


<!-- PAGE 3 -->

<div class="page" id="p3">

<h2 class="collageTitle">

Your Rose Bouquet 🌹

</h2>

<div class="note n1">Forever Yours 🤍</div>
<div class="note n2">Beautiful Soul 💕</div>
<div class="note n3">My Sunshine ☀️</div>
<div class="note n4">Happy Birthday 💖</div>
<div class="note n5">Sara ❤️</div>

<img src="bouquet.png" class="bouquet">

<button class="btn"

onclick="show('p4')">

Continue →

</button>

</div>


<!-- PAGE 4 -->

<div class="page" id="p4">

<div class="final">

<div style="font-size:120px">
🎁
</div>

<h1 style="font-size:46px;color:#c10059">

Happy Birthday Sara ❤️

</h1>

<p style="font-size:22px;margin-top:20px">

May your smile stay forever ✨

</p>

<button class="btn"

onclick="location.reload()">

Replay

</button>

</div>

</div>

</div>

<script>

document.addEventListener("click",()=>{

document.getElementById("bgmusic").play();

},{once:true});

let play=true;

musicBtn.onclick=function(){

let m=document.getElementById("bgmusic");

if(play){

m.pause();

this.innerHTML="▶️";

}else{

m.play();

this.innerHTML="🎵";

}

play=!play;

}

let count=0;

function pop(x){

x.classList.add("pop");

count++;

if(count===4){

setTimeout(()=>show("p2"),500);

}

}

function show(id){

document.querySelectorAll(".page")

.forEach(x=>x.classList.remove("active"));

document.getElementById(id)

.classList.add("active");

}

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML="💗";

h.style.left=Math.random()*100+"%";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

},600);

</script>

</body>
</html>
